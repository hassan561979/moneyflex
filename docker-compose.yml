name: moneyflex

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: development
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        restart: unless-stopped
        volumes:
            # The source is bind mounted for live reload; the entrypoint runs
            # composer install on first boot, and the pinned platform in
            # composer.json keeps that resolution identical to the image.
            - .:/var/www/html
        # Deliberately no env_file: compose would snapshot .env at container
        # creation, and a real environment variable always beats the .env file
        # in Laravel. An APP_KEY that was still empty at boot would then shadow
        # the generated one until the container was recreated. Laravel reads
        # the bind-mounted .env itself, so it always sees current values.
        environment:
            AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
            AUTO_SEED: "${AUTO_SEED:-true}"
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - moneyflex

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - "${APP_HOST_PORT:-8080}:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - moneyflex

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-moneyflex}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_123}
        ports:
            # Published on 3307 so a MySQL already running on the host keeps 3306.
            - "${DB_HOST_PORT:-3307}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-root_123}"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s
        networks:
            - moneyflex

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - moneyflex

volumes:
    mysql-data:
    redis-data:

networks:
    moneyflex:
        driver: bridge
